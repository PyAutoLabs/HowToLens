# Scripts to skip during automated runs (smoke tests, pre-release checks, CI).
# Each entry is matched against script paths:
#   - Entries with '/' do a substring match against the file path
#   - Entries without '/' match the file stem exactly
# Add an inline # comment to document the reason for skipping.
#
# THIS LIST IS REPO-LOCAL. Do not copy entries from autolens_workspace (or any
# other repo) into it. HowToLens contains only chapter_*/tutorial_*.py, so a
# workspace path such as `gui/mask` or `cluster/modeling` can never match here;
# it is silently inert, not a skip. In July 2026 this file had accumulated 28
# such entries against 2 real ones. Every entry below must match a file in THIS
# repo — verify with `should_skip` in PyAutoHands/autohands/build_util.py before
# adding one.
#
# SLOW-skip convention:
#   Entries tagged `# SLOW <YYYY-MM-DD> - <reason>` mark scripts that are
#   skipped because they exceed the per-script timeout cap (300s by
#   default; 1800s for mode=release runs). These are
#   NOT permanent skips — every mega-run surfaces them with a loud warning
#   banner. Fix the performance issue and remove the SLOW marker.
#
# NEEDS_FIX convention:
#   Entries tagged `# NEEDS_FIX <YYYY-MM-DD> - <reason>` mark scripts that
#   are broken and parked as a to-do list. Like SLOW-skips, these are NOT
#   permanent skips — every mega-run surfaces them with a loud warning
#   banner. Investigate the failure, fix the underlying bug, and remove
#   the NEEDS_FIX marker.

- tutorial_6_borders # NEEDS_FIX 2026-08-04 - cap-induced, not a mask problem:
  # fails only under PYAUTO_SMALL_DATASETS (IndexError: index 371 out of bounds
  # for axis 0 with size 272) and passes on the same dataset files without the
  # cap. Hardcoded pix/border indices outrun the capped mesh. Fix by decoupling
  # the indices (or the mesh shape) from dataset resolution, as HowToGalaxy
  # chapter_4 tutorial_3 did, then remove this entry.
